<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="src/css/main.css">
</head>
<body>
 <div id="background">
    <div id="display">
        <h2 id="calculations"></h2>
        <h2 id="result"></h2>
    </div>
    <div id="buttons">
        <ul class="row">
            <li><button id="percentage">Clear</button></li>
            <li><button id="CE">CE</button></li>
            <li><button id="C">C</button></li>
            <li><button id="clear"> </button></li>
        </ul>
        <ul class="row">
            <li><button id="inverse"> </button></li>
            <li><button id="square"> </button></li>
            <li><button id="square-root"> </button></li>
            <li><button id="divide"> </button></li>
        </ul>
        <ul class="row">
            <li><button id="seven">7</button></li>
            <li><button id="eight">8</button></li>
            <li><button id="nine">9</button></li>
            <li><button id="multiply">x</button></li>
        </ul>
        <ul class="row">
            <li><button id="four">4</button></li>
            <li><button id="five">5</button></li>
            <li><button id="six">6</button></li>
            <li><button id="subtract">-</button></li>
        </ul>
        <ul class="row">
            <li><button id="one">1</button></li>
            <li><button id="two">2</button></li>
            <li><button id="three">3</button></li>
            <li><button id="add">+</button></li>
        </ul>
        <ul class="row">
            <li><button id="plus/minus">+/-</button></li>
            <li><button id="zero">0</button></li>
            <li><button id="decimal-point">.</button></li>
            <li><button id="equals-to">=</button></li>
        </ul>
    </div>
 </div>
    <style src = 'src/js/main.js'></style>
</body>
</html>
