<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
    <div id="display">
        <h2 id="calculations"></h2>
        <h2 id="result"></h2>
    </div>
    <div id="buttons">
        <ul class="row">
            <li><button id="percentage">%</button></li>
            <li><button id="CE">CE</button></li>
            <li><button id="C">C</button></li>
            <li><button id="clear">Clear</button></li>
        </ul>
        <ul class="row">
            <li><button id="inverse">1/x </button></li>
            <li><button id="square">x**2</button></li>
            <li><button id="square-root">sqrt of x</button></li>
            <li><button class = "arith-buttons">/</button></li>
        </ul>
        <ul class="row">
            <li><button class="numbered-button">7</button></li>
            <li><button class="numbered-button">8</button></li>
            <li><button class="numbered-button">9</button></li>
            <li><button class = "arith-buttons">*</button></li>
        </ul>
        <ul class="row">
            <li><button class="numbered-button">4</button></li>
            <li><button class="numbered-button">5</button></li>
            <li><button class="numbered-button">6</button></li>
            <li><button class = "arith-buttons">-</button></li>
        </ul>
        <ul class="row">
            <li><button class="numbered-button">1</button></li>
            <li><button class="numbered-button">2</button></li>
            <li><button class="numbered-button">3</button></li>
            <li><button class = "arith-buttons">+</button></li>
        </ul>
        <ul class="row">
            <li><button id="plus/minus">+/-</button></li>
            <li><button class="numbered-button">0</button></li>
            <li><button id="decimal-point">.</button></li>
            <li><button id="equals-to">=</button></li>
        </ul>
    </div>

    <script src = "src/script.js"></script>
</body>
</html>
